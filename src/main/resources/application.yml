spring:
  datasource:
    url: jdbc:mysql://localhost:3306/customer_db?useSSL=false&serverTimezone=UTC&characterEncoding=utf8
    username: root
    password: password
    driver-class-name: com.mysql.cj.jdbc.Driver
  application:
    name: customer-api

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.example.customerapi.model
  configuration:
    map-underscore-to-camel-case: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

server:
  port: 8080
